<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <title>Saamer Mansoor | ConferenceCaptioning</title>
        <meta name="description" content="Saamer Mansoor, founder of ConferenceCaptioning. Save my contact, try live captions and translation free, or book a demo.">
        <meta name="author" content="Saamer Mansoor">
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="robots" content="noindex, follow">
        <link rel="canonical" href="https://conferencecaptioning.com/business-card/">
        <meta name="theme-color" content="#0a1726">
        <meta property="og:site_name" content="ConferenceCaptioning">
        <meta property="og:type" content="profile">
        <meta property="og:url" content="https://conferencecaptioning.com/business-card/">
        <meta property="og:title" content="Saamer Mansoor | ConferenceCaptioning">
        <meta property="og:description" content="Save my contact, try live captions and translation free, or book a demo.">
        <meta property="og:image" content="https://conferencecaptioning.com/images/apple-touch-icon-180x180.png">
        <link rel="apple-touch-icon" sizes="180x180" href="https://conferencecaptioning.com/images/apple-touch-icon-180x180.png">
        <link rel="icon" type="image/png" sizes="32x32" href="https://conferencecaptioning.com/images/favicon.png">
        <style>
            :root { color-scheme: dark; }
            * { box-sizing: border-box; }
            body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px 16px; background: #0a1726; color: #fff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; line-height: 1.5; }
            .card { width: 100%; max-width: 420px; text-align: center; }
            .logo { width: 188px; height: 37px; margin: 0 auto 28px; display: block; }
            h1 { margin: 0; font-size: 30px; line-height: 1.2; }
            .role { margin: 6px 0 0; font-size: 17px; color: #38bdf8; font-weight: 600; }
            .pitch { margin: 16px 0 28px; font-size: 16px; opacity: .85; }
            .btn { display: block; width: 100%; padding: 16px 20px; margin: 0 0 12px; border-radius: 12px; font-size: 18px; font-weight: 600; text-decoration: none; text-align: center; border: 2px solid transparent; }
            .btn-primary { background: #fff; color: #0a1726; }
            .btn-accent { background: #38bdf8; color: #0a1726; }
            .btn-outline { border-color: rgba(255,255,255,.4); color: #fff; }
            .btn:active { transform: scale(.98); }
            .links { margin-top: 20px; font-size: 15px; display: flex; flex-wrap: wrap; justify-content: center; gap: 8px 20px; }
            .links a { color: #fff; opacity: .8; text-decoration: underline; text-underline-offset: 3px; }
            #save-note { min-height: 20px; margin: 4px 0 12px; font-size: 14px; color: #38bdf8; }
        </style>
      <script defer src="https://conferencecaptioning.com/js/siteTracking.js?v=20260929"></script>
    </head>
    <body>
        <main class="card">
            <img class="logo" src="https://conferencecaptioning.com/images/logo-white.svg" alt="ConferenceCaptioning logo" width="188" height="37">
            <h1>Saamer Mansoor</h1>
            <p class="role">Founder, ConferenceCaptioning</p>
            <p class="pitch">Live captions and real-time translation for events, in under a second, in 50+ languages. Works offline.</p>

            <a id="save" class="btn btn-primary" data-cta="save-contact" href="https://conferencecaptioning.com/Saamer%20Mansoor.vcf" download="Saamer Mansoor.vcf">Save my contact</a>
            <div id="save-note" role="status" aria-live="polite"></div>
            <a class="btn btn-accent" data-cta="try-free" href="https://app.conferencecaptioning.com">Try it free</a>
            <a class="btn btn-outline" data-cta="book-demo" href="https://conferencecaptioning.com/portal">Book a demo</a>

            <div class="links">
                <a data-cta="watch-demo" href="https://www.youtube.com/watch?v=gF1GJmRAGzM">Watch the demo</a>
                <a data-cta="chrome-extension" href="https://conferencecaptioning.com/blog/conference-captioning-chrome-extension-on-device-ai/">Windows &amp; Chrome</a>
                <a data-cta="email" href="mailto:hello@conferencecaptioning.com">Email</a>
                <a data-cta="call" href="tel:+12146839508">Call</a>
                <a data-cta="linkedin" href="https://www.linkedin.com/in/saamer">LinkedIn</a>
                <a data-cta="website" href="https://conferencecaptioning.com/">Website</a>
            </div>
        </main>
        <script>
            // Android in-app QR browsers and Chrome mishandle a direct .vcf link (server sends text/plain).
            // Build the file client-side with the right MIME type so Contacts opens it. iOS keeps the normal link.
            (function () {
                var link = document.getElementById('save');
                var note = document.getElementById('save-note');
                if (!/Android/i.test(navigator.userAgent) || !window.fetch || !window.Blob) return;
                link.addEventListener('click', function (e) {
                    e.preventDefault();
                    fetch(link.href).then(function (r) {
                        if (!r.ok) throw new Error('vcf');
                        return r.text();
                    }).then(function (text) {
                        var blob = new Blob([text], { type: 'text/vcard;charset=utf-8' });
                        var url = URL.createObjectURL(blob);
                        var a = document.createElement('a');
                        a.href = url;
                        a.download = 'Saamer Mansoor.vcf';
                        document.body.appendChild(a);
                        a.click();
                        a.remove();
                        setTimeout(function () { URL.revokeObjectURL(url); }, 5000);
                        note.textContent = 'Downloaded. Tap the file to add it to Contacts.';
                    }).catch(function () {
                        window.location.href = link.href;
                    });
                });
            })();
        </script>
        <script>
            // Log which button was tapped, tagged with ?src=<event> from the QR URL (page views already record the full URL).
            document.addEventListener('click', function (e) {
                var el = e.target.closest && e.target.closest('[data-cta]');
                if (!el || !window.fetch) return;
                var src = new URLSearchParams(location.search).get('src') || 'direct';
                fetch('https://api.deafassistant.com/analytics/Event', {
                    method: 'POST',
                    keepalive: true,
                    headers: { 'Content-Type': 'application/json; charset=utf-8' },
                    body: JSON.stringify({ Event: 'BusinessCard: ' + el.getAttribute('data-cta') + ' (src=' + src + ')' })
                }).catch(function () {});
            });
        </script>
        <script src="https://conferencecaptioning.com/js/jquery.min.js"></script>
        <script defer src="https://conferencecaptioning.com/js/analyticsLite.js"></script>
    </body>
</html>
