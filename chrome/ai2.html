<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Transcription & Translation | ConferenceCaptioning</title>
    <style>
        :root {
            --bg-color: #193C5D;
            --panel-bg: rgba(255, 255, 255, 0.05);
            --panel-border: rgba(255, 255, 255, 0.1);
            --text-main: #ffffff;
            --text-muted: #a3b8cc;
            --accent-green: #2ecc71;
            --accent-red: #e74c3c;
            --accent-blue: #3498db;
            --font-family: 'Inter', system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: var(--font-family);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        header {
            width: 100%;
            padding: 2rem 0;
            text-align: center;
            background: linear-gradient(180deg, rgba(0,0,0,0.2) 0%, rgba(0,0,0,0) 100%);
        }
        header img { max-height: 45px; pointer-events: none; }

        .container {
            width: 90%;
            max-width: 1000px;
            margin: 2rem auto;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .glass-panel {
            background: var(--panel-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--panel-border);
            border-radius: 16px;
            padding: 2rem;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
        }

        /* Dials Layout */
        .dials-row {
            display: flex;
            justify-content: space-around;
            flex-wrap: wrap;
            gap: 2rem;
        }
        
        .dial-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.5rem;
        }

        .dial {
            width: 100px;
            height: 100px;
            position: relative;
            cursor: ns-resize;
        }

        .dial svg { transform: rotate(-90deg); width: 100%; height: 100%; }
        .dial-track { fill: none; stroke: rgba(255,255,255,0.1); stroke-width: 8; }
        .dial-progress {
            fill: none; stroke: var(--accent-blue); stroke-width: 8;
            stroke-linecap: round; transition: stroke-dashoffset 0.1s;
        }
        .dial-value {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            font-size: 1.2rem; font-weight: bold; pointer-events: none;
        }
        .dial-label { font-size: 0.85rem; color: var(--text-muted); text-align: center; text-transform: uppercase; letter-spacing: 1px; }

        /* Translation Controls */
        .translation-toggle {
            margin-top: 1rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            padding-bottom: 1rem;
            border-bottom: 1px solid var(--panel-border);
        }
        .translation-toggle input { width: 20px; height: 20px; cursor: pointer; }

        #translation-settings { display: none; margin-top: 1.5rem; }
        
        .languages-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
            margin-top: 1.5rem;
        }

        .lang-select-group { display: flex; flex-direction: column; gap: 0.3rem; }
        .lang-select-group label { font-size: 0.85rem; color: var(--text-muted); }
        select {
            background: rgba(0,0,0,0.3); color: #fff;
            border: 1px solid var(--panel-border); border-radius: 8px;
            padding: 0.6rem; font-size: 1rem; cursor: pointer; outline: none;
        }

        #translation-status {
            margin-top: 1rem; color: var(--accent-blue); font-weight: bold; font-size: 0.9rem;
        }
        .error-text { color: var(--accent-red) !important; }

        /* Status & Controls */
        .controls { display: flex; align-items: center; justify-content: space-between; gap: 1rem; flex-wrap: wrap; margin-bottom: 1rem;}
        .status-badge { display: flex; align-items: center; gap: 0.5rem; padding: 0.5rem 1rem; border-radius: 50px; font-weight: 600; font-size: 0.9rem; background: rgba(255, 255, 255, 0.1); }
        .status-dot { width: 10px; height: 10px; border-radius: 50%; background: #ccc; }
        .status-listening .status-dot { background: var(--accent-green); box-shadow: 0 0 10px var(--accent-green); animation: pulse 1.5s infinite; }
        .status-processing .status-dot { background: var(--accent-blue); box-shadow: 0 0 10px var(--accent-blue); animation: spinPulse 1s infinite; }

        @keyframes pulse { 0%, 100% { transform: scale(0.95); opacity: 0.8; } 50% { transform: scale(1.2); opacity: 1; } }
        @keyframes spinPulse { 0%, 100% { transform: scale(0.8); opacity: 0.5; } 50% { transform: scale(1.1); opacity: 1; } }

        button { border: none; padding: 0.8rem 1.5rem; border-radius: 8px; font-size: 1rem; font-weight: 600; cursor: pointer; color: #fff; transition: all 0.2s; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        #startBtn { background: var(--accent-green); }
        #startBtn:hover:not(:disabled) { background: #27ae60; }
        #stopBtn { background: var(--accent-red); }
        #stopBtn:hover:not(:disabled) { background: #c0392b; }

        /* Output Area */
        #output { height: 400px; overflow-y: auto; display: flex; flex-direction: column; gap: 1rem; padding: 1rem; background: rgba(0, 0, 0, 0.15); border-radius: 8px; border: inset 1px rgba(255,255,255,0.05); }
        
        .utterance { background: rgba(255,255,255,0.05); padding: 1rem; border-radius: 12px; animation: fadeIn 0.4s ease-out forwards; }
        .text-en { font-size: 1.3rem; color: #fff; margin-bottom: 0.5rem; }
        .text-tl { font-size: 1.1rem; color: #90caf9; margin-top: 0.5rem; display: flex; align-items: flex-start; gap: 0.5rem; }
        .lang-tag { background: rgba(0,0,0,0.3); padding: 0.2rem 0.5rem; border-radius: 4px; font-size: 0.75rem; text-transform: uppercase; font-weight: bold; color: var(--text-muted); }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: rgba(0,0,0,0.1); border-radius: 4px; }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 4px; }
    </style>
</head>
<body>

    <header>
        <img src="https://conferencecaptioning.com/images/logo-white.svg" alt="Conference Captioning">
    </header>

    <div class="container">
        
        <!-- SETTINGS PANEL -->
        <div class="glass-panel">
            <h3 style="margin-top: 0; color: var(--text-muted);">Voice Activity Detection (VAD) Controls</h3>
            <p style="font-size: 0.85rem; color: #888; margin-bottom: 1.5rem;">Click and drag up/down on the dials to adjust.</p>
            
            <div class="dials-row">
                <!-- Dials will be injected here by JS -->
                <div id="dial-vol" class="dial-container"></div>
                <div id="dial-silence" class="dial-container"></div>
                <div id="dial-speech" class="dial-container"></div>
            </div>

            <!-- Translation Section -->
            <label class="translation-toggle">
                <input type="checkbox" id="enable-translation"> Enable Live Translations
            </label>
            
            <div id="translation-settings">
                <div class="dials-row" style="justify-content: flex-start; margin-bottom: 1rem;">
                    <div id="dial-langs" class="dial-container"></div>
                </div>
                <div id="languages-container" class="languages-grid"></div>
                <div id="translation-status"></div>
            </div>
        </div>

        <!-- MAIN APP PANEL -->
        <div class="glass-panel">
            <div class="controls">
                <div style=display:flex;gap:1rem;flex-wrap:wrap;align-items:center>
                    <button id=startBtn>Start Captioning</button>
                    <button id=pauseBtn style="display:none">Pause</button>
                    <button id=stopBtn disabled>Stop</button>
                    <button id=resetBtn style="background:#555">Reset to Defaults</button>
                </div>
                <div id=init-notice style="font-size:0.85rem;color:var(--accent-yellow, #f39c12);margin-top:0.5rem;display:none;"></div>
                <div id=tip-notice style="font-size:0.85rem;color:var(--text-muted);margin-top:0.25rem;display:none;"></div>
                <div id="status" class="status-badge status-idle">
                    <div class="status-dot"></div>
                    <span id="status-text">Ready</span>
                </div>
            </div>
            <div id="output"></div>
        </div>
    </div>
    <script>
        const LANGUAGES={ar:"Arabic",bg:"Bulgarian",bn:"Bengali",cs:"Czech",da:"Danish",de:"German",el:"Greek",en:"English",es:"Spanish",fi:"Finnish",fr:"French",hi:"Hindi",hr:"Croatian",hu:"Hungarian",id:"Indonesian",it:"Italian",iw:"Hebrew",ja:"Japanese",kn:"Kannada",ko:"Korean",lt:"Lithuanian",mr:"Marathi",nl:"Dutch",no:"Norwegian",pl:"Polish",pt:"Portuguese",ro:"Romanian",ru:"Russian",sk:"Slovak",sl:"Slovenian",sv:"Swedish",ta:"Tamil",te:"Telugu",th:"Thai",tr:"Turkish",uk:"Ukrainian",vi:"Vietnamese",zh:"Simplified Chinese","zh-Hant":"Traditional Chinese"};
        
        // LocalStorage helpers & Defaults
        const DEFAULT_CONFIG = {
            vadConfig: { volume: 0.05, silence: 800, speech: 400 },
            translationConfig: { enabled: false, numLangs: 1, targets: ["es", "fr", "de", "it"] }
        };
        
        function loadSettings() {
            const savedVAD = localStorage.getItem("cc_vadConfig");
            const savedTrans = localStorage.getItem("cc_translationConfig");
            if (savedVAD) try { vadConfig = JSON.parse(savedVAD); } catch(e){}
            if (savedTrans) try { translationConfig = JSON.parse(savedTrans); } catch(e){}
        }
        
        function saveSettings() {
            localStorage.setItem("cc_vadConfig", JSON.stringify(vadConfig));
            localStorage.setItem("cc_translationConfig", JSON.stringify(translationConfig));
        }
        
        let vadConfig = { ...DEFAULT_CONFIG.vadConfig };
        let translationConfig = { ...DEFAULT_CONFIG.translationConfig };
        loadSettings();
        
        let aiSession=null, activeTranslators=[], stream, audioContext, mediaRecorder, isRecording=!1, isPaused=!1, silenceTimer=null, chunks=[], startTime=0, noCaptionTimer=null;
        
        const transToggle=document.getElementById("enable-translation"),
              transSettings=document.getElementById("translation-settings"),
              langsContainer=document.getElementById("languages-container"),
              transStatusText=document.getElementById("translation-status"),
              initNotice=document.getElementById("init-notice"),
              tipNotice=document.getElementById("tip-notice");
        
        transToggle.checked = translationConfig.enabled;
        transSettings.style.display = translationConfig.enabled ? "block" : "none";
        
        // Get RoomName from Query String or default
        const urlParams = new URLSearchParams(window.location.search);
        const roomName = urlParams.get("roomName") || "expressacademy";
        
        function updateLanguageDropdowns(e){
            translationConfig.numLangs=e;
            langsContainer.innerHTML="";
            for(let n=0;n<e;n++){
                const t=document.createElement("div");
                t.className="lang-select-group";
                const a=document.createElement("label");
                a.innerText=`Language ${n+1}`;
                const s=document.createElement("select");
                s.id=`lang-sel-${n}`;
                Object.entries(LANGUAGES).forEach(([code, name])=>{
                    const opt=document.createElement("option");
                    opt.value=code;
                    opt.innerText=`${name} (${code})`;
                    if(code===translationConfig.targets[n]) opt.selected=!0;
                    s.appendChild(opt);
                });
                s.addEventListener("change",e=>{
                    translationConfig.targets[n]=e.target.value;
                    saveSettings();
                });
                t.appendChild(a);
                t.appendChild(s);
                langsContainer.appendChild(t);
            }
            saveSettings();
        }
        
        function createDial(e,t,a,n,s,i,r,o,l){
            const d=document.getElementById(e);
            const c=2*Math.PI*40;
            d.innerHTML=`<div class="dial"><svg viewBox="0 0 100 100"><circle class="dial-track" cx="50" cy="50" r="40"></circle><circle class="dial-progress" cx="50" cy="50" r="40" stroke-dasharray="${c}" stroke-dashoffset="${c}"></circle></svg><div class="dial-value"></div></div><div class="dial-label">${t}</div>`;
            const u=d.querySelector(".dial"),g=d.querySelector(".dial-progress"),m=d.querySelector(".dial-value");
            let p=i;
            function h(){
                var e=(p-a)/(n-a),e=c-e*c;
                g.style.strokeDashoffset=e;
                m.innerText=o?o(p):p;
                l(p);
            }
            let f=!1,v=0,T=0;
            u.addEventListener("mousedown",e=>{f=!0,v=e.clientY,T=p,document.body.style.userSelect="none"});
            window.addEventListener("mousemove",t=>{
                if(f){
                    t=v-t.clientY;t=Math.floor(t/5);let e=T+t*s;
                    if(e>n)e=n;if(e<a)e=a;
                    p=r?parseFloat(e.toFixed(3)):e;
                    h();
                    saveSettings();
                }
            });
            window.addEventListener("mouseup",()=>{f=!1,document.body.style.userSelect="auto"});
            h();
        }
        
        transToggle.addEventListener("change",e=>{
            translationConfig.enabled=e.target.checked;
            transSettings.style.display=translationConfig.enabled?"block":"none";
            saveSettings();
        });
        
        createDial("dial-vol","Volume Threshold",.01,.1,.005,vadConfig.volume,!0,e=>e.toFixed(3),e=>vadConfig.volume=e);
        createDial("dial-silence","Silence (ms)",500,3e3,100,vadConfig.silence,!1,e=>e+"ms",e=>vadConfig.silence=e);
        createDial("dial-speech","Min Speech (ms)",200,1500,100,vadConfig.speech,!1,e=>e+"ms",e=>vadConfig.speech=e);
        createDial("dial-langs","Simultaneous Languages",1,4,1,translationConfig.numLangs,!1,e=>e,e=>updateLanguageDropdowns(e));
        
        const startBtn=document.getElementById("startBtn"),
              pauseBtn=document.getElementById("pauseBtn"),
              stopBtn=document.getElementById("stopBtn"),
              resetBtn=document.getElementById("resetBtn"),
              statusBadge=document.getElementById("status"),
              statusText=document.getElementById("status-text"),
              output=document.getElementById("output");
        
        resetBtn.onclick = () => {
            localStorage.clear();
            location.reload();
        };
        
        function setStatus(e,t){statusText.innerText=e,statusBadge.className=`status-badge ${t}`}
        
        async function verifyAndLoadTranslators(){
            const e=window.Translator||window.translation;
            if(!e)return!(transStatusText.innerHTML='<span class="error-text">❌ Unsupported browser, translations unavailable.</span>');
            activeTranslators=[];
            for(let t of translationConfig.targets.slice(0,translationConfig.numLangs)){
                if("en"!==t){
                    transStatusText.innerText=`Checking availability for ${LANGUAGES[t]}...`;
                    try{
                        const n=e.availability||e.canTranslate,s=await n.call(e,{sourceLanguage:"en",targetLanguage:t});
                        const i=["available","downloadable","readily","after-download"];
                        if(!i.includes(s))return transStatusText.innerHTML=`<span class="error-text">❌ Language ${LANGUAGES[t]} is unavailable.</span>`,!1;
                        transStatusText.innerText=`Loading ${LANGUAGES[t]}...`;
                        var a=await e.create({sourceLanguage:"en",targetLanguage:t});
                        activeTranslators.push({code:t,instance:a});
                    }catch(e){return transStatusText.innerHTML=`<span class="error-text">❌ Error initializing ${LANGUAGES[t]}.</span>`,!1}
                }
            }
            transStatusText.innerHTML='<span style="color:var(--accent-green)">✔ Translations Ready</span>';
            return!0;
        }
        
        function setupVAD(e){
            audioContext=new AudioContext;
            const t=audioContext.createMediaStreamSource(e),a=audioContext.createAnalyser();
            a.fftSize=512;t.connect(a);
            const n=new Float32Array(a.fftSize);
            !function e(){
                if(aiSession && !isPaused){
                    a.getFloatTimeDomainData(n);let t=0;
                    for(let e=0;e<n.length;e++)t+=n[e]*n[e];
                    Math.sqrt(t/n.length)>vadConfig.volume?(silenceTimer&&(clearTimeout(silenceTimer),silenceTimer=null),isRecording||startRecording()):isRecording&&!silenceTimer&&(silenceTimer=setTimeout(()=>{stopRecordingAndTranscribe(),silenceTimer=null},vadConfig.silence));
                }
                if(!isPaused) requestAnimationFrame(e);
            }();
        }
        
        function startRecording(){
            if(isPaused) return;
            isRecording=!0,setStatus("Capturing speech...","status-listening"),chunks=[],startTime=Date.now(),mediaRecorder=new MediaRecorder(stream),mediaRecorder.ondataavailable=e=>chunks.push(e.data),mediaRecorder.onstop=processAudioChunk,mediaRecorder.start();
        }
        
        function stopRecordingAndTranscribe(){
            if(isRecording&&"inactive"!==mediaRecorder.state&&(isRecording=!1,setStatus("Processing AI...","status-processing"),mediaRecorder.stop(),!noCaptionTimer)){
                // Setup 5s No-caption timer check
                noCaptionTimer = setTimeout(()=>{
                    if(output.children.length === 0){
                        tipNotice.style.display = "block";
                        tipNotice.innerText = "💡 Tip: No captions received yet. Try reducing the 'Silence (ms)' dial down to 500ms.";
                    }
                }, 5000);
            }
        }
        
        async function processAudioChunk(){
            Date.now()-startTime-vadConfig.silence<vadConfig.speech?setStatus("Listening for speech...","status-idle"):(await transcribe(new Blob(chunks,{type:mediaRecorder.mimeType})),isRecording||setStatus("Listening for speech...","status-idle"))
        }
        
        async function sendApiPayload(fullTranscript, translationsMap) {
            const payload = {
                roomName: roomName,
                description: `${roomName} Accessibility Stream`,
                transcript: fullTranscript,
                isActivelyStreaming: !isPaused,
                inputLanguage: "en",
                outputLanguage: "",
                outputLanguage2: "",
                outputLanguage3: "",
                outputLanguage4: "",
                translation: "",
                translation2: "",
                translation3: "",
                translation4: "",
                isPremiumCustomer: false,
                blockStorage: false,
                uid: "12345",
                isProximityEnabled: true,
                customQuestionPrompt: "Ask a question"
            };
        
            // Map targets to outputLanguage / translation properties dynamically
            translationConfig.targets.slice(0, translationConfig.numLangs).forEach((code, idx) => {
                const langKey = idx === 0 ? "outputLanguage" : `outputLanguage${idx + 1}`;
                const transKey = idx === 0 ? "translation" : `translation${idx + 1}`;
                payload[langKey] = code;
                payload[transKey] = translationsMap[code] || "";
                const cleanTranslation = translationsMap[code].replaceAll(code.toUpperCase() + "\n", "").trim() || "";
                payload[transKey] = cleanTranslation;
            });
        
            try {
                await fetch("https://api.deafassistant.com/stream/LiteSmartAdd", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(payload)
                });
            } catch (err) {
                console.error("API transmission error:", err);
            }
        }
        
        async function transcribe(e){
            e=await e.arrayBuffer();
            try{
                if(output.children.length === 0) {
                    initNotice.style.display = "block";
                    initNotice.innerText = "⏳ Initializing first caption (this can take a moment, subsequent captions will be faster)...";
                }
        
                const s=await aiSession.prompt([{role:"user",content:[{type:"text",value:"Transcribe this audio precisely. Keep capitalization and punctuation exact (e.g., lowercase mid-sentence, proper caps after periods/question marks/exclamations). Just the text."},{type:"audio",value:e}]}]);
                var t=s.trim();
                if(!t)return;
        
                if(noCaptionTimer) { clearTimeout(noCaptionTimer); noCaptionTimer = null; }
                initNotice.style.display = "none";
                tipNotice.style.display = "none";
        
                const i=document.createElement("div");
                i.className="utterance";
                const r=document.createElement("div");
                r.className="text-en";
                r.innerText=t;
                i.appendChild(r);
                output.appendChild(i);
                output.scrollTop=output.scrollHeight;
        
                var translationsMap = {};
                if(translationConfig.enabled&&0<activeTranslators.length){
                    const translationPromises = activeTranslators.map(async (a) => {
                        const translatedText = await a.instance.translate(t);
                        return { code: a.code, text: translatedText };
                    });
        
                    const results = await Promise.allSettled(translationPromises);
                    results.forEach(res => {
                        if (res.status === "fulfilled") {
                            const { code, text } = res.value;
                            
                            // Strip unwanted language code prefixes like "KO\n" or "FR\n" if returned by Chrome AI
                            const cleanText = text.replace(/^[A-Z]{2}\n/, "").trim();
                            
                            translationsMap[code] = cleanText;
                            const o = document.createElement("div");
                            o.className = "text-tl";
                            o.innerHTML = `<span class="lang-tag">${code}</span> <span>${cleanText}</span>`;
                            i.appendChild(o);
                        }
                    });

                    output.scrollTop=output.scrollHeight;
                }
        
                // Gather up to last 10 sentences for transcript and each translation stream
                const allTextNodes = output.querySelectorAll('.text-en');
                const recentTextNodes = Array.from(allTextNodes).slice(-10);
                const fullTranscript = recentTextNodes.map(node => node.innerText).join(" ");
        
                let aggregatedTranslations = {};
                translationConfig.targets.slice(0, translationConfig.numLangs).forEach(code => {
                    const langUtterances = output.querySelectorAll(`.utterance`);
                    const recentTranslations = Array.from(langUtterances).slice(-10).map(utt => {
                        const tlNode = Array.from(utt.querySelectorAll('.text-tl')).find(el => el.innerHTML.includes(code));
                        return tlNode ? tlNode.innerText.replace(code, "").trim() : "";
                    }).filter(Boolean);
                    aggregatedTranslations[code] = recentTranslations.join(" ");
                });
        
                sendApiPayload(fullTranscript, aggregatedTranslations);
        
            }catch(e){console.error("Transcription error:",e); initNotice.style.display="none";}
        }
        
        startBtn.onclick=async()=>{
            try{
                startBtn.disabled=!0;
                transToggle.disabled=!0;
                const e=window.LanguageModel||window.ai&&window.ai.languageModel;
                if(!e)return alert("Chrome AI Language Model not detected."),void(startBtn.disabled=!1);
                
                setStatus("Initializing AI...","status-idle");
                if(translationConfig.enabled)if(!await verifyAndLoadTranslators())return startBtn.disabled=!1,void setStatus("Translation Error","status-idle");
                
                aiSession=await e.create({expectedInputs:[{type:"audio"},{type:"text"}],expectedOutputs:[{type:"text",languages:["en"]}]});
                stream=await navigator.mediaDevices.getUserMedia({audio:!0});
                
                stopBtn.disabled=!1;
                startBtn.style.display="none";
                pauseBtn.style.display="inline-block";
                isPaused = false;
                
                setupVAD(stream);
                setStatus("Listening for speech...","status-idle");
            }catch(e){console.error(e),setStatus("Error starting system","status-idle"),startBtn.disabled=!1}
        };
        
        pauseBtn.onclick = () => {
            isPaused = !isPaused;
            if(isPaused) {
                pauseBtn.innerText = "Resume";
                setStatus("Paused","status-idle");
                if(mediaRecorder && mediaRecorder.state === "recording") mediaRecorder.stop();
            } else {
                pauseBtn.innerText = "Pause";
                setStatus("Listening for speech...","status-idle");
            }
        };
        
        stopBtn.onclick=()=>{
            audioContext&&audioContext.close();
            aiSession&&aiSession.destroy();
            stream&&stream.getTracks().forEach(e=>e.stop());
            location.reload();
        };
    </script>
</body>
</html>
