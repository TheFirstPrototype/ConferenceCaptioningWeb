<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Google Slides Presentation</title>
  <style>
    /* Reset default margins and set a black background */
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #000000;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    /* Container to keep the 16:9 aspect ratio and fit the viewport */
    .slide-wrapper {
      position: relative;
      width: 100vw;
      height: 56.25vw; /* 16:9 ratio (9 / 16 = 0.5625) */
      max-height: 100vh;
      max-width: 177.78vh; /* 16:9 ratio (16 / 9 = 1.7778) */
    }

    /* Make iframe fill the container */
    .slide-wrapper iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }
  </style>
</head>
<body>

  <div class="slide-wrapper">
    <iframe 
      src="https://docs.google.com/presentation/d/e/2PACX-1vRFU488SWeo4-az9XfQ4Yp01fYt4QKrePrR3kyr0RopZtjvPo1iM9dK7MGWpWBMLg/pubembed?start=true&loop=false&delayms=60000" 
      frameborder="0" 
      allowfullscreen="true" 
      mozallowfullscreen="true" 
      webkitallowfullscreen="true">
    </iframe>
  </div>

</body>
</html>
