<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Caption Overlay</title>
  <style>
    /* Fully transparent by default - an OBS/vMix "Browser Source" (and
       most modern mixers) composites real alpha with no chroma key
       needed. `chroma=<hex>` below opts into a solid background instead,
       for older capture cards/switchers that only support chroma keying. */
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: transparent;
      overflow: hidden;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    #stage {
      position: fixed;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    #viewport {
      overflow: hidden;
      width: 100%;
    }
    #track {
      display: flex;
      flex-direction: column;
      will-change: transform;
    }
    .line {
      padding: 0.15em 0.5em;
      word-wrap: break-word;
    }
    .line .box {
      display: inline;
      box-decoration-break: clone;
      -webkit-box-decoration-break: clone;
      border-radius: 0.15em;
      padding: 0.05em 0.3em;
    }
    #debug-badge {
      position: fixed;
      top: 0.6rem;
      left: 0.6rem;
      font-family: monospace;
      font-size: 0.75rem;
      padding: 0.3rem 0.6rem;
      border-radius: 4px;
      background: rgba(0, 0, 0, 0.6);
      color: #0f0;
    }
    #debug-badge.error { color: #f55; }
  </style>
</head>
<body>
  <div id="stage">
    <div id="viewport">
      <div id="track"></div>
    </div>
  </div>
  <div id="debug-badge" style="display:none"></div>

  <script>
    // OBS/vMix/ProPresenter "Browser Source" caption overlay - reads a
    // presenter's broadcast (live/broadcast.py, same SSE feed as
    // watch.html) and renders it as a scrolling, TV-style caption crawl
    // against a transparent (or chroma-keyed) background, fully styled
    // via URL query params so an AV engineer can point a mixer straight
    // at this page with no code changes. See README "Caption overlay for
    // video mixers (OBS / vMix / ProPresenter)" for the full param list
    // and setup steps.
    const API_HOST = "stream.conferencecaptioning.com";
    const params = new URLSearchParams(window.location.search);

    function p(name, fallback) {
      const v = params.get(name);
      return v === null || v === "" ? fallback : v;
    }
    function pInt(name, fallback) {
      const v = parseInt(params.get(name), 10);
      return Number.isFinite(v) ? v : fallback;
    }
    function pBool(name, fallback) {
      const v = params.get(name);
      if (v === null) return fallback;
      return v === "true" || v === "1";
    }
    function pColor(name, fallback) {
      const v = (params.get(name) || "").replace(/^#/, "");
      return /^[0-9a-fA-F]{3}([0-9a-fA-F]{3})?$/.test(v) ? `#${v}` : fallback;
    }

    const streamName = (p("stream", "") || "").trim().toLowerCase();
    const targetLang = (p("lang", "") || "").trim().toLowerCase(); // empty = original spoken-language captions
    const fontSize = pInt("fontSize", 42); // px
    const fontFamily = p("fontFamily", ""); // e.g. "Arial" - falls back to the page's own system-ui stack if unset
    const fontWeight = pInt("fontWeight", 700);
    const textColor = pColor("textColor", "#ffffff");
    const align = ["left", "center", "right"].includes(p("align", "")) ? p("align", "") : "center";
    const maxLines = Math.max(1, pInt("lines", pInt("maxLines", 2)));
    const scrollSpeedMs = Math.max(0, pInt("scrollSpeed", 400));
    const bottomPct = pInt("bottom", 6); // distance from the bottom edge, vh
    const maxWidthPct = pInt("maxWidth", 86); // vw
    const chroma = pColor("chroma", null); // null = transparent (real alpha)
    const outline = pBool("outline", pBool("textShadow", true)); // legibility over moving video with no box behind the text
    const boxColor = pColor("boxColor", null);
    const boxOpacity = Math.min(100, Math.max(0, pInt("boxOpacity", boxColor ? 60 : 0)));
    const debug = pBool("debug", false);

    document.body.style.background = chroma || "transparent";

    const stage = document.getElementById("stage");
    stage.style.bottom = `${bottomPct}vh`;
    stage.style.maxWidth = `${maxWidthPct}vw`;
    stage.style.width = `${maxWidthPct}vw`;
    stage.style.alignItems = align === "left" ? "flex-start" : align === "right" ? "flex-end" : "center";

    const track = document.getElementById("track");
    track.style.transition = `transform ${scrollSpeedMs}ms ease`;
    track.style.textAlign = align;

    const lineStyleBase = [
      `font-size:${fontSize}px`,
      `font-weight:${fontWeight}`,
      `line-height:1.35`,
      fontFamily ? `font-family:${JSON.stringify(fontFamily).slice(1, -1)}, system-ui, sans-serif` : "",
    ].filter(Boolean).join(";");

    const textShadowValue = outline
      ? "-1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000, 1px 1px 0 #000, 0 2px 6px rgba(0,0,0,0.85)"
      : "none";

    const debugBadge = document.getElementById("debug-badge");
    function setDebug(text, isError) {
      if (!debug) return;
      debugBadge.style.display = "block";
      debugBadge.textContent = text;
      debugBadge.className = isError ? "error" : "";
    }

    if (!streamName) {
      setDebug("missing ?stream=<name> - see README \"Caption overlay for video mixers\"", true);
      throw new Error("overlay.html requires ?stream=<name>");
    }

    // -- Scrolling caption crawl -------------------------------------------
    // Classic TV-caption technique: append each new line to the bottom of
    // `#track`, then translateY it up by exactly the height of whatever's
    // now beyond the last `maxLines` entries - `#viewport`'s overflow:hidden
    // clips everything above that. Old, now off-screen lines are trimmed
    // from the DOM only once their scroll-up transition has finished (not
    // before), so nothing visibly jumps mid-animation - see the
    // `transitionend` handler below.
    const KEEP_BUFFER = 3; // extra off-screen lines kept as a cushion before trimming

    function currentHideHeight(children) {
      if (children.length <= maxLines) return 0;
      const toHide = children.slice(0, children.length - maxLines);
      return toHide.reduce((sum, el) => sum + el.getBoundingClientRect().height, 0);
    }

    function addLine(text) {
      if (!text) return;
      const line = document.createElement("div");
      line.className = "line";
      line.style.cssText = lineStyleBase;
      const box = document.createElement("span");
      box.className = "box";
      box.style.color = textColor;
      box.style.textShadow = textShadowValue;
      if (boxColor && boxOpacity > 0) {
        const r = parseInt(boxColor.slice(1, 3), 16);
        const g = parseInt(boxColor.slice(3, 5), 16);
        const b = parseInt(boxColor.slice(5, 7), 16);
        box.style.background = `rgba(${r},${g},${b},${boxOpacity / 100})`;
      }
      box.textContent = text;
      line.appendChild(box);
      track.appendChild(line);

      requestAnimationFrame(() => {
        const hideHeight = currentHideHeight(Array.from(track.children));
        track.style.transform = `translateY(-${hideHeight}px)`;
      });
    }

    track.addEventListener("transitionend", (e) => {
      if (e.target !== track || e.propertyName !== "transform") return;
      const children = Array.from(track.children);
      const keep = maxLines + KEEP_BUFFER;
      if (children.length <= keep) return;
      const removeCount = children.length - keep;
      const toRemove = children.slice(0, removeCount);
      const removedHeight = toRemove.reduce((sum, el) => sum + el.getBoundingClientRect().height, 0);
      track.style.transition = "none";
      toRemove.forEach((el) => track.removeChild(el));
      const remaining = Array.from(track.children);
      track.style.transform = `translateY(-${currentHideHeight(remaining)}px)`;
      void track.offsetHeight; // force reflow before re-enabling the transition
      track.style.transition = `transform ${scrollSpeedMs}ms ease`;
      void removedHeight; // kept only for clarity of intent above, not used further
    });

    // -- Live feed (GET /live/watch/{stream_name}, same SSE wire format as
    // watch.html) --------------------------------------------------------
    let latestTranslationText = null;
    function connect() {
      setDebug("connecting...", false);
      const source = new EventSource(`https://${API_HOST}/live/watch/${encodeURIComponent(streamName)}`);

      source.onopen = () => setDebug(`live - stream "${streamName}"${targetLang ? ` (${targetLang})` : ""}`, false);

      source.onmessage = (event) => {
        const payload = JSON.parse(event.data);
        if (payload.type === "watch_connected") {
          setDebug(`live - stream "${streamName}"${targetLang ? ` (${targetLang})` : ""}`, false);
        } else if (payload.type === "segment") {
          if (!targetLang) addLine(payload.text);
        } else if (payload.type === "translation") {
          if (targetLang && payload.translations && payload.translations[targetLang]) {
            const text = payload.translations[targetLang];
            // The rolling-translation window (see live/router.py's
            // TRANSLATION_WINDOW_SEGMENTS) can re-send overlapping
            // phrasing as the window shifts - only add a genuinely new
            // value, not a byte-identical repeat.
            if (text !== latestTranslationText) {
              latestTranslationText = text;
              addLine(text);
            }
          }
        } else if (payload.type === "session_ended") {
          setDebug("session ended", true);
          source.close();
        } else if (payload.type === "error") {
          setDebug(payload.message || "error", true);
          source.close();
        }
      };

      source.onerror = () => {
        setDebug("connection lost - reconnecting...", true);
        // EventSource reconnects on its own; if the stream name is bad or
        // the session truly ended, each retry just gets a 404 and this
        // stays on the "reconnecting" message rather than falsely
        // claiming "live" - fine for an unattended overlay.
      };
    }
    connect();
  </script>
</body>
</html>
